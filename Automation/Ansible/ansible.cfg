# ansible.cfg

[defaults]
# Sets the path to the inventory file.
inventory = ~/ansible

# Specify roles and collections paths
roles_path = /etc/ansible/roles
collections_paths = /etc/ansible/collections

# Enable gathering of network facts for Cisco IOS
gathering = smart
gather_subset = '!all'

# Set the retry limit for failed connections
retry_files_enabled = False

# Enable privilege escalation
become = True
become_method = enable

# Disable host key checking for network devices
host_key_checking = False

# Use YAML output format
stdout_callback = yaml

# Time in seconds to wait for an SSH connection
timeout = 30

[privilege_escalation]
# Cisco IOS-specific enable password
become_ask_pass = False

[ssh_connection]
# Control SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
control_path = ~/.ssh/ansible-ssh-%%h-%%p-%%r

# Increase the timeout for SSH connections
pipelining = True
retries = 3

[accelerate]
# Accelerate mode for faster deployments (Optional)
accelerate_port = 5099
accelerate_timeout = 30
accelerate_connect_timeout = 5

[loggers]
# Log detailed Ansible output
log_path = /var/log/ansible.log

[network]
# Increase timeout and set persistent connections for network modules
persistent_connection_timeout = 30
persistent_command_timeout = 60